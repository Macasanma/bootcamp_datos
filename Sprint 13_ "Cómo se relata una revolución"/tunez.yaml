# =========================================================
# CONFIGURACIÓN DE BÚSQUEDA — Corpus: Revolución tunecina (2010-2011)
# Esquema reutilizable para cualquier conflicto (ver notas al final)
# =========================================================

conflict_id: "tunez_2010_2011"
description: "Revolución tunecina y Primavera Árabe: cobertura en prensa española"

date_range:
  start: "2010-12-17"   # autoinmolación de Mohamed Bouazizi (evento fundacional)
  end: "2011-12-31"     # cierre de la primera fase (elecciones Asamblea Constituyente, oct-2011, + margen)
  note: >
    El rango se abre 1 año completo para poder analizar la evolución
    "antes / durante / después" sin excluir la fase de transición.

# ---------------------------------------------------------
# GRUPO 1 — LUGAR
# Justificación: ancla geográfica obligatoria del corpus.
# Riesgo: "Túnez" es ambiguo entre país y capital → no filtra por sí solo,
# pero es necesario como keyword base de recuperación amplia.
# ---------------------------------------------------------
place:
  - term: "Túnez"
    variants: ["Tunez", "Tunicia"]   # Tunicia: forma antigua, aparece en prensa de más edad
    note: "País y capital comparten nombre; desambiguación se hace en fase de limpieza, no de scraping."
  - term: "Sidi Bouzid"
    note: "Ciudad origen de las protestas (inmolación de Bouazizi). Alta precisión, bajo ruido."
  - term: "Kasserine"
    note: "Foco de represión violenta temprana, muy citada en enero 2011."
  - term: "Sfax"
    note: "Segunda ciudad del país, relevante en cobertura de protestas regionales."

# ---------------------------------------------------------
# GRUPO 2 — PERSONAS
# Justificación: actores individuales cuya presencia en un titular
# es indicio casi seguro de relevancia para el corpus, incluso sin
# mencionar "Túnez" explícitamente (ej. "Ben Ali abandona el poder").
# ---------------------------------------------------------
people:
  - term: "Ben Ali"
    variants: ["Zine el-Abidine Ben Ali", "Zin el Abidin Ben Ali"]
    note: "Presidente derrocado. Entidad central del relato pre/post revolución."
  - term: "Mohamed Bouazizi"
    variants: ["Mohammed Bouazizi", "Tarek al-Tayeb Bouazizi"]
    note: "Evento fundacional (autoinmolación, 17-dic-2010). Nombre con transliteraciones variables."
  - term: "Rachid Ghannouchi"
    variants: ["Rached Ghannouchi", "Ghannuchi"]
    note: "Líder histórico de Ennahda, actor clave en la transición post-Ben Ali."
  - term: "Beji Caid Essebsi"
    variants: ["Béji Caïd Essebsi", "Caid Essebsi"]
    note: "Primer ministro de transición (feb-2011 en adelante)."
  - term: "Fouad Mebazaa"
    variants: ["Foued Mebazaa"]
    note: "Presidente interino tras la salida de Ben Ali."
  - term: "Mohamed Ghannouchi"
    note: "Primer ministro bajo Ben Ali y en los primeros días de transición. Cuidado: no confundir con Rachid Ghannouchi (Ennahda) — son personas distintas con apellido idéntico."
  - term: "Hamadi Jebali"
    note: "Primer ministro tras elecciones de octubre 2011 (cierre del corpus)."
  - term: "Rachid Ammar"
    variants: ["general Rachid Ammar"]
    note: "Jefe del Estado Mayor del ejército tunecino; se negó a disparar contra los manifestantes, figura clave en la caída de Ben Ali."

# ---------------------------------------------------------
# GRUPO 3 — ORGANIZACIONES / INSTITUCIONES
# Justificación: estructuras que canalizan el conflicto (partido oficialista,
# oposición islamista, sindicato). Permiten analizar el discurso sobre
# "actores colectivos" y no solo individuos.
# ---------------------------------------------------------
organizations:
  - term: "Ennahda"
    variants: ["Ennahdha", "An-Nahda", "Al Nahda"]
    note: "Partido islamista, gran ganador electoral de oct-2011. Múltiples transliteraciones en prensa."
  - term: "UGTT"
    variants: ["Unión General Tunecina del Trabajo"]
    note: "Sindicato con papel decisivo en la movilización. Siglas + nombre completo, ambos aparecen en prensa."
  - term: "RCD"
    variants: ["Reagrupación Constitucional Democrática"]
    note: "Partido de Ben Ali, disuelto en 2011. Clave para el discurso sobre el 'antiguo régimen'."
  - term: "ejército tunecino"
    variants: ["ejército de Túnez", "fuerzas armadas tunecinas"]
    note: >
      ADVERTENCIA METODOLÓGICA: nunca usar solo "ejército" como keyword,
      genera ruido masivo con noticias de cualquier país. Siempre acompañado
      del gentilicio o país.

# ---------------------------------------------------------
# GRUPO 4 — CONCEPTOS / MARCOS DISCURSIVOS
# Justificación: estos términos SON en sí mismos objeto de análisis
# (cómo cambia su uso a lo largo del tiempo es una pregunta de investigación,
# no solo un filtro de búsqueda).
# ---------------------------------------------------------
concepts:
  - term: "revolución tunecina"
    variants: ["revolución de Túnez"]
  - term: "revolución de los jazmines"
    variants: ["revolución del jazmín"]
    note: "Denominación mediática temprana, interesante para trazar cuándo se abandona en favor de 'primavera árabe'."
  - term: "primavera árabe"
    note: "Término que se populariza progresivamente; su frecuencia en el tiempo es un dato de análisis."
  - term: "protestas Túnez"
    variants: ["disturbios Túnez", "revueltas Túnez"]
    note: "Fase inicial del conflicto, antes de consolidarse el marco 'revolución'."
  - term: "Asamblea Constituyente"
    variants: ["Asamblea Nacional Constituyente"]
    note: "Marca el cierre institucional de la fase revolucionaria (elecciones oct-2011)."
  - term: "transición democrática"
    note: "Marco discursivo de la fase posterior a la caída de Ben Ali."

# ---------------------------------------------------------
# GRUPO 5 — MARCADORES NARRATIVOS (NO son criterio de inclusión)
# Justificación: términos demasiado genéricos para usarse como filtro de
# scraping (aparecen en cobertura de cualquier país/conflicto), pero muy
# útiles como ETIQUETAS DE FASE una vez que el artículo ya entró al corpus
# por otra vía (Grupo 1, 2 o 3).
# Uso: NO se buscan de forma independiente en el scraper.
#      Se buscan únicamente DENTRO de artículos ya recuperados,
#      para marcar en qué fase narrativa se sitúan.
# ---------------------------------------------------------
narrative_markers:
  - term: "toque de queda"
    phase: "represión aguda"
    note: "Marcador temporal claro de la fase de represión (enero 2011)."
  - term: "exilio"
    variants: ["Arabia Saudí"]
    phase: "cierre del arco de Ben Ali"
    note: "Ben Ali huye a Arabia Saudí; cierre narrativo de su papel como personaje."
  - term: "efecto contagio"
    variants: ["efecto dominó"]
    phase: "marco comparativo regional"
    note: "Marco usado para vincular Túnez con Egipto y el resto de la Primavera Árabe, sobre todo desde feb-2011."

# ---------------------------------------------------------
# ESTRATEGIA DE SCRAPING
# ---------------------------------------------------------
strategy:
  approach: "OR amplio + deduplicación posterior"
  rationale: >
    Se buscan TODAS las keywords de los grupos 1-4 de forma independiente
    (unión, no intersección). Es preferible recuperar de más y filtrar con
    pandas (drop_duplicates por URL/ID de artículo) que arriesgarse a perder
    noticias relevantes por una query demasiado restrictiva.
  dedup_key: "url"  # o "id_articulo" si la fuente lo proporciona
  case_sensitive: false
  normalize_accents: true  # para no depender de que el medio escriba bien las tildes
  inclusion_groups: ["place", "people", "organizations", "concepts"]
  post_hoc_groups: ["narrative_markers"]
  post_hoc_note: >
    El Grupo 5 (narrative_markers) NUNCA se usa para decidir si un artículo
    entra en el corpus. Se aplica solo DESPUÉS del scraping, sobre los
    artículos ya recuperados, para etiquetar la fase narrativa (columna
    adicional en el DataFrame, no filtro de búsqueda).
  scraping_controls:
    max_paginas_por_keyword: 6   # límite antes de considerar la keyword "agotada"
    pausa_segundos: 2            # pausa entre peticiones si se automatiza parcialmente
    nota: "Aunque el método de búsqueda sea manual, fijar un máximo de páginas evita revisar resultados de baja relevancia una vez pasado el grueso de artículos útiles."

# =========================================================
# NOTA PARA REUTILIZACIÓN EN OTROS CONFLICTOS
# =========================================================
# Este esquema (place / people / organizations / concepts / strategy)
# es agnóstico al caso. Para un nuevo conflicto:
#   1. Duplicar este archivo como config/<nombre_conflicto>.yaml
#   2. Cambiar conflict_id, description y date_range
#   3. Rellenar las 4 categorías con las entidades propias del caso
#   4. El scraper no necesita ningún cambio de código
